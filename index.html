<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#020706">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Worldio">
<title>Worldio — World Radio</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="preconnect" href="https://tiles.maps.eox.at" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.6.0/dist/maplibre-gl.css">
<style>
:root{--bg:#020706;--panel:rgba(5,15,12,.84);--line:rgba(183,255,214,.13);--text:#f3fff8;--muted:#91aa9e;--green:#78ffb5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body,#map{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:var(--text)}
body:before{content:"";position:fixed;z-index:3;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 42%,transparent 14%,rgba(0,0,0,.04) 47%,rgba(0,0,0,.62) 100%)}
#map{position:fixed;inset:0}.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{display:none}.maplibregl-canvas{outline:none}
.top{position:fixed;z-index:20;top:max(14px,env(safe-area-inset-top));left:13px;right:13px;display:flex;align-items:center;gap:9px}.brand{height:45px;padding:0 13px;border-radius:23px;display:flex;align-items:center;gap:9px;background:rgba(3,10,8,.68);backdrop-filter:blur(22px);border:1px solid var(--line);font-size:15px;font-weight:900;letter-spacing:-.04em}.brandDot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 16px var(--green)}
.searchWrap{position:relative;flex:1}.search{width:100%;height:45px;border-radius:23px;border:1px solid var(--line);background:rgba(3,10,8,.7);backdrop-filter:blur(22px);color:#fff;outline:0;padding:0 44px 0 16px;font-size:15px}.search::placeholder{color:#779185}.searchBtn{position:absolute;right:5px;top:5px;width:35px;height:35px;border:0;border-radius:18px;background:var(--green);color:#062116;font-weight:900;font-size:18px}
.hud{position:fixed;z-index:16;left:50%;transform:translateX(-50%);top:max(70px,calc(env(safe-area-inset-top) + 60px));padding:7px 11px;border-radius:16px;border:1px solid var(--line);background:rgba(3,10,8,.66);backdrop-filter:blur(18px);font-size:11px;color:#b8cec3;max-width:84vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.25s}
.side{position:fixed;z-index:18;right:12px;top:120px;display:flex;flex-direction:column;gap:8px}.mini{width:43px;height:43px;border-radius:50%;border:1px solid var(--line);background:rgba(3,10,8,.72);backdrop-filter:blur(18px);color:#fff;font-size:18px}
.player{position:fixed;z-index:25;left:11px;right:11px;bottom:max(11px,env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(8,25,19,.91),rgba(3,12,9,.96));border:1px solid var(--line);backdrop-filter:blur(30px);border-radius:28px;padding:13px 13px 12px;box-shadow:0 26px 75px rgba(0,0,0,.55)}.playerMain{display:flex;align-items:center;gap:11px}.art{width:58px;height:58px;border-radius:18px;background:radial-gradient(circle at 30% 25%,#90ffd0,#24a66e 42%,#0a3425 75%);display:grid;place-items:center;overflow:hidden;border:1px solid rgba(255,255,255,.1);flex:none}.art img{width:100%;height:100%;object-fit:cover}.artFallback{font-size:24px}.stationMeta{flex:1;min-width:0}.stationName{font-size:16px;font-weight:820;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stationSub{font-size:11px;color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.live{display:inline-flex;align-items:center;gap:5px;margin-top:5px;color:var(--green);font-size:10px;font-weight:800}.live i{width:6px;height:6px;background:var(--green);border-radius:50%;box-shadow:0 0 10px var(--green)}.playerBtns{display:flex;align-items:center;gap:7px}.round{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.045);color:#fff;font-size:18px}.play{width:53px;height:53px;border:0;border-radius:50%;background:var(--green);color:#052216;font-size:21px;font-weight:900}.bar{display:flex;align-items:center;gap:9px;margin-top:10px}.bar span{color:var(--muted);font-size:10px}.bar input{width:100%;accent-color:var(--green)}
.sheet{position:fixed;z-index:40;inset:0;background:rgba(0,0,0,.38);display:none}.sheet.show{display:block}.panel{position:absolute;left:7px;right:7px;bottom:7px;max-height:72vh;overflow:auto;background:#071712;border:1px solid var(--line);border-radius:30px;padding:11px 11px calc(12px + env(safe-area-inset-bottom));box-shadow:0 30px 90px rgba(0,0,0,.7)}.handle{width:43px;height:5px;background:#315044;border-radius:5px;margin:3px auto 12px}.panelHead{display:flex;align-items:center;gap:8px;padding:0 3px 8px}.panelTitle{flex:1;font-weight:850;font-size:18px}.chip{height:34px;padding:0 11px;border-radius:17px;border:1px solid var(--line);background:#0b271d;color:#dcf3e7;font-size:12px}.result{display:flex;align-items:center;gap:11px;padding:10px 5px;border-top:1px solid var(--line)}.resultArt{width:45px;height:45px;border-radius:13px;background:#0c2a20;display:grid;place-items:center;overflow:hidden;flex:none}.resultArt img{width:100%;height:100%;object-fit:cover}.resultMeta{flex:1;min-width:0}.resultName{font-size:14px;font-weight:760;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.resultSub{font-size:10px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.resultPlay{height:34px;padding:0 12px;border:0;border-radius:17px;background:var(--green);color:#052216;font-size:12px;font-weight:850}.empty{padding:30px 10px;text-align:center;color:var(--muted);font-size:13px}.toast{position:fixed;z-index:60;left:50%;bottom:158px;transform:translate(-50%,15px);padding:9px 13px;border-radius:18px;background:#edfdf5;color:#09261b;font-weight:750;font-size:12px;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:720px){.player,.panel{left:auto;width:430px;right:18px}.top{left:18px;right:18px}.searchWrap{max-width:430px;margin-left:auto}.toast{bottom:28px}}
</style>
</head>
<body>
<div id="map"></div>
<div class="top"><div class="brand"><span class="brandDot"></span>WORLDIO</div><form class="searchWrap" id="searchForm"><input class="search" id="search" placeholder="局名・国・ジャンルを検索" autocomplete="off"><button class="searchBtn" aria-label="検索">⌕</button></form></div>
<div class="hud" id="hud">地球を起動しています…</div>
<div class="side"><button class="mini" id="nearBtn" aria-label="この場所の局">◎</button><button class="mini" id="randomBtn" aria-label="ランダム">✦</button><button class="mini" id="favListBtn" aria-label="お気に入り">♡</button></div>
<div class="player"><div class="playerMain"><div class="art" id="art"><span class="artFallback">◉</span></div><div class="stationMeta"><div class="stationName" id="stationName">地球から局を選んでください</div><div class="stationSub" id="stationSub">世界中のインターネットラジオ</div><div class="live" id="liveLabel" style="visibility:hidden"><i></i>LIVE</div></div><div class="playerBtns"><button class="round" id="favBtn">♡</button><button class="play" id="playBtn">▶</button></div></div><div class="bar"><span>VOL</span><input id="volume" type="range" min="0" max="1" value="0.85" step="0.01"></div></div>
<div class="sheet" id="sheet"><div class="panel"><div class="handle"></div><div class="panelHead"><div class="panelTitle" id="panelTitle">Radio stations</div><button class="chip" id="closeSheet">閉じる</button></div><div id="results"></div></div></div>
<div class="toast" id="toast"></div><audio id="audio" playsinline></audio>
<script src="https://unpkg.com/maplibre-gl@6.6.0/dist/maplibre-gl.js"></script>
<script>
const MIRROR_BOOT='https://de1.api.radio-browser.info';
const LAND_URL='https://raw.githubusercontent.com/datasets/geo-boundaries-world-110m/main/countries.geojson';
const STATION_CACHE='worldio:stations:v3',CACHE_TTL=12*60*60*1000;
let mirrors=[MIRROR_BOOT,'https://nl1.api.radio-browser.info'];
let mirrorIndex=0,stationPool=[],current=null,mapReady=false,landData=null,landByCode=new Map(),correctedCount=0,hiddenSeaCount=0,nowAnimStarted=false;
const $=s=>document.querySelector(s),audio=$('#audio'),hud=$('#hud'),sheet=$('#sheet'),results=$('#results');
let favorites=JSON.parse(localStorage.getItem('worldio:favs')||'[]'),recent=JSON.parse(localStorage.getItem('worldio:recent')||'[]');
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1700)}
function status(t){hud.textContent=t}
function esc(s){return String(s||'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
function idle(fn,timeout=1200){if('requestIdleCallback'in window)requestIdleCallback(fn,{timeout});else setTimeout(fn,80)}
async function api(path,opts={}){let last;for(let i=0;i<mirrors.length;i++){const base=mirrors[(mirrorIndex+i)%mirrors.length];try{const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),7000);const r=await fetch(base+path,{...opts,signal:ctrl.signal,headers:{Accept:'application/json',...(opts.headers||{})}});clearTimeout(timer);if(!r.ok)throw Error(r.status);mirrorIndex=(mirrorIndex+i)%mirrors.length;return await r.json()}catch(e){last=e}}throw last||Error('API unavailable')}
async function discoverMirrors(){try{const list=await api('/json/servers');const found=[...new Set(list.map(x=>x.name).filter(Boolean).map(n=>'https://'+n))];if(found.length)mirrors=found.sort(()=>Math.random()-.5)}catch(e){}}
const worldFeature={type:'Feature',geometry:{type:'Polygon',coordinates:[[[-180,-84],[-90,-84],[0,-84],[90,-84],[180,-84],[180,84],[90,84],[0,84],[-90,84],[-180,84],[-180,-84]]]},properties:{}};
const fastStyle={version:8,projection:{type:'globe'},sources:{ocean:{type:'geojson',data:worldFeature}},layers:[{id:'ocean',type:'fill',source:'ocean',paint:{'fill-color':'#07120f','fill-opacity':1}}]};
const map=new maplibregl.Map({container:'map',style:fastStyle,center:[12,25],zoom:1.55,pitch:0,bearing:0,attributionControl:false,dragRotate:false,touchPitch:false,maxZoom:12,minZoom:.6,fadeDuration:250});
map.on('load',()=>{mapReady=true;try{map.setProjection({type:'globe'});map.setFog({color:'rgb(2,7,6)','high-color':'rgb(10,29,23)','horizon-blend':.08,'space-color':'rgb(0,2,2)','star-intensity':.28})}catch(e){}status('地球準備完了 · ラジオ局を読み込み中…');restoreStationCache();setTimeout(loadSatellite,220);idle(loadData,500)});
function loadSatellite(){if(!mapReady||map.getSource('satellite'))return;try{map.addSource('satellite',{type:'raster',tiles:['https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/default/g/{z}/{y}/{x}.jpg'],tileSize:256,maxzoom:11,attribution:'Sentinel-2 cloudless — EOX'});const before=map.getLayer('worldio-land-tint')?'worldio-land-tint':map.getLayer('clusters-glow')?'clusters-glow':undefined;map.addLayer({id:'satellite',type:'raster',source:'satellite',paint:{'raster-opacity':.76,'raster-saturation':-.65,'raster-contrast':.14,'raster-brightness-min':.05,'raster-brightness-max':.54,'raster-hue-rotate':28,'raster-fade-duration':250}},before)}catch(e){console.warn('satellite unavailable',e)}}
function ringContains(pt,ring){let inside=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){const xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];const hit=((yi>pt[1])!==(yj>pt[1]))&&(pt[0]<(xj-xi)*(pt[1]-yi)/((yj-yi)||1e-12)+xi);if(hit)inside=!inside}return inside}
function polygonContains(pt,poly){if(!ringContains(pt,poly[0]))return false;for(let i=1;i<poly.length;i++)if(ringContains(pt,poly[i]))return false;return true}
function geometryContains(pt,g){if(!g)return false;if(g.type==='Polygon')return polygonContains(pt,g.coordinates);if(g.type==='MultiPolygon')return g.coordinates.some(p=>polygonContains(pt,p));return false}
function featureCode(f){const p=f.properties||{};return String(p.ISO_A2||p.iso_a2||p['ISO3166-1-Alpha-2']||p.id||'').toUpperCase()}
function anywhereOnLand(pt){return landData?.features?.some(f=>geometryContains(pt,f.geometry))||false}
function snapToLand(lng,lat,feature){const radii=[20,50,100],dirs=12;for(const km of radii){const dLat=km/111;for(let i=0;i<dirs;i++){const a=i*Math.PI*2/dirs,dLng=km/(111*Math.max(.2,Math.cos(lat*Math.PI/180))),p=[lng+Math.cos(a)*dLng,lat+Math.sin(a)*dLat];if(feature?geometryContains(p,feature.geometry):anywhereOnLand(p))return p}}return null}
async function loadLand(){if(landData)return;try{const r=await fetch(LAND_URL,{cache:'force-cache'});if(!r.ok)throw Error(r.status);landData=await r.json();for(const f of landData.features||[]){const c=featureCode(f);if(c&&c!=='-99')landByCode.set(c,f)}addLandLayers()}catch(e){console.warn('land mask unavailable',e)}}
function addLandLayers(){if(!mapReady||!landData||map.getSource('landmask'))return;map.addSource('landmask',{type:'geojson',data:landData});map.addLayer({id:'worldio-land-tint',type:'fill',source:'landmask',paint:{'fill-color':'#0d241b','fill-opacity':['interpolate',['linear'],['zoom'],.5,.18,5,.08]}});map.addLayer({id:'worldio-borders',type:'line',source:'landmask',paint:{'line-color':'rgba(143,255,194,.2)','line-width':['interpolate',['linear'],['zoom'],1,.3,6,.75],'line-opacity':['interpolate',['linear'],['zoom'],1,.4,6,.18]}})}
function normalizeStations(list){correctedCount=0;hiddenSeaCount=0;const out=[];for(const s of list){let lat=+s.geo_lat,lng=+s.geo_long;if(!Number.isFinite(lat)||!Number.isFinite(lng)||Math.abs(lat)>90||Math.abs(lng)>180)continue;s._geoCorrected=false;if(landData){const pt=[lng,lat],country=landByCode.get(String(s.countrycode||'').toUpperCase());if(country){if(geometryContains(pt,country.geometry)){s._displayLng=lng;s._displayLat=lat}else{const snapped=snapToLand(lng,lat,country);if(snapped){s._displayLng=snapped[0];s._displayLat=snapped[1];s._geoCorrected=true;correctedCount++}else{hiddenSeaCount++;continue}}}else if(anywhereOnLand(pt)){s._displayLng=lng;s._displayLat=lat}else{hiddenSeaCount++;continue}}else{s._displayLng=lng;s._displayLat=lat}out.push(s)}return out}
function compactStation(s){return{stationuuid:s.stationuuid,name:s.name,url:s.url,url_resolved:s.url_resolved,favicon:s.favicon,city:s.city,country:s.country,countrycode:s.countrycode,tags:s.tags,codec:s.codec,geo_lat:s.geo_lat,geo_long:s.geo_long,_displayLat:s._displayLat,_displayLng:s._displayLng,_geoCorrected:!!s._geoCorrected}}
function restoreStationCache(){try{const c=JSON.parse(localStorage.getItem(STATION_CACHE)||'null');if(!c||Date.now()-c.t>CACHE_TTL||!Array.isArray(c.items)||!c.items.length)return;stationPool=c.items;addStationsToMap();status(`${stationPool.length.toLocaleString()}局を即時表示 · 最新データを更新中…`)}catch(e){}}
function saveStationCache(){try{localStorage.setItem(STATION_CACHE,JSON.stringify({t:Date.now(),items:stationPool.slice(0,1000).map(compactStation)}))}catch(e){}}
function stationGeoJson(){return{type:'FeatureCollection',features:stationPool.filter(s=>Number.isFinite(+s._displayLng)&&Number.isFinite(+s._displayLat)).map(s=>({type:'Feature',geometry:{type:'Point',coordinates:[+s._displayLng,+s._displayLat]},properties:{id:s.stationuuid,corrected:s._geoCorrected?1:0}}))}}
function addStationsToMap(){if(!mapReady||!stationPool.length)return;const data=stationGeoJson();if(map.getSource('stations')){map.getSource('stations').setData(data);return}map.addSource('stations',{type:'geojson',data,cluster:true,clusterMaxZoom:7,clusterRadius:36});map.addLayer({id:'clusters-glow',type:'circle',source:'stations',filter:['has','point_count'],paint:{'circle-color':'rgba(120,255,181,.10)','circle-radius':['step',['get','point_count'],18,15,24,40,30],'circle-blur':.7}});map.addLayer({id:'clusters',type:'circle',source:'stations',filter:['has','point_count'],paint:{'circle-color':'rgba(120,255,181,.23)','circle-radius':['step',['get','point_count'],10,15,14,40,19],'circle-stroke-width':1,'circle-stroke-color':'rgba(151,255,200,.72)'}});map.addLayer({id:'station-halo',type:'circle',source:'stations',filter:['!',['has','point_count']],paint:{'circle-color':'rgba(120,255,181,.18)','circle-radius':['interpolate',['linear'],['zoom'],1,5,6,10],'circle-blur':.75}});map.addLayer({id:'station-points',type:'circle',source:'stations',filter:['!',['has','point_count']],paint:{'circle-color':['case',['==',['get','corrected'],1],'#b2ffd2','#78ffb5'],'circle-radius':['interpolate',['linear'],['zoom'],1,1.7,6,4.3],'circle-stroke-color':'rgba(220,255,236,.38)','circle-stroke-width':['interpolate',['linear'],['zoom'],1,.4,6,1]}});map.addSource('now-playing',{type:'geojson',data:{type:'FeatureCollection',features:[]}});map.addLayer({id:'now-glow',type:'circle',source:'now-playing',paint:{'circle-color':'#78ffb5','circle-radius':14,'circle-opacity':.14,'circle-blur':.65}});map.addLayer({id:'now-dot',type:'circle',source:'now-playing',paint:{'circle-color':'#eafff2','circle-radius':4.5,'circle-stroke-width':2,'circle-stroke-color':'#78ffb5'}});map.on('click','clusters',async e=>{const f=e.features[0],zoom=await map.getSource('stations').getClusterExpansionZoom(f.properties.cluster_id);map.easeTo({center:f.geometry.coordinates,zoom:Math.min(zoom,8),duration:650})});map.on('click','station-points',e=>{const id=e.features[0].properties.id,s=stationPool.find(x=>x.stationuuid===id);if(s)selectStation(s,true)});if(!nowAnimStarted){nowAnimStarted=true;animateNowPlaying()}}
function animateNowPlaying(){let start=performance.now();const loop=t=>{if(map.getLayer('now-glow')){const phase=((t-start)%1900)/1900;map.setPaintProperty('now-glow','circle-radius',10+phase*15);map.setPaintProperty('now-glow','circle-opacity',.2*(1-phase))}requestAnimationFrame(loop)};requestAnimationFrame(loop)}
async function loadData(){try{const stationPromise=api('/json/stations/search?hidebroken=true&has_geo_info=true&order=clickcount&reverse=true&limit=900');await Promise.all([discoverMirrors(),loadLand()]);const raw=await stationPromise;stationPool=normalizeStations(raw.filter(s=>s.stationuuid&&s.url_resolved));addStationsToMap();saveStationCache();status(`${stationPool.length.toLocaleString()}局を表示 · 海上${hiddenSeaCount}件除外`);idle(loadMoreStations,1800)}catch(e){console.error(e);if(!stationPool.length)status('局データを取得できません。再読み込みしてください')}}
async function loadMoreStations(){try{const raw=await api('/json/stations/search?hidebroken=true&has_geo_info=true&order=clickcount&reverse=true&limit=2500');const full=normalizeStations(raw.filter(s=>s.stationuuid&&s.url_resolved));stationPool=full;addStationsToMap();saveStationCache();status(`${stationPool.length.toLocaleString()}局 · 海上${hiddenSeaCount}件除外 · ${correctedCount}件補正`)}catch(e){}}
function distance(a,b,c,d){const R=6371,rad=x=>x*Math.PI/180,x=rad(c-a),y=rad(d-b),z=Math.sin(x/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(z))}
function renderList(list,title='Radio stations'){$('#panelTitle').textContent=title;results.innerHTML=list.length?list.slice(0,80).map(s=>`<div class="result"><div class="resultArt">${s.favicon?`<img src="${esc(s.favicon)}" loading="lazy" onerror="this.remove()">`:'◉'}</div><div class="resultMeta"><div class="resultName">${esc(s.name||'Unknown station')}</div><div class="resultSub">${esc([s.city,s.country,s.tags?.split(',')[0]].filter(Boolean).join(' · '))}</div></div><button class="resultPlay" data-id="${esc(s.stationuuid)}">▶</button></div>`).join(''):'<div class="empty">ラジオ局が見つかりませんでした</div>';sheet.classList.add('show');results.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const s=[...stationPool,...favorites,...recent].find(x=>x.stationuuid===b.dataset.id);if(s){sheet.classList.remove('show');selectStation(s,true)}})}
async function searchStations(q){if(!q.trim())return;status(`「${q}」を検索中…`);try{const list=await api('/json/stations/search?hidebroken=true&limit=100&order=clickcount&reverse=true&name='+encodeURIComponent(q));renderList(list.filter(s=>s.stationuuid&&s.url_resolved),`「${q}」の検索結果`);status(`${list.length}局見つかりました`)}catch(e){toast('検索に失敗しました')}}
function updateNowPoint(s){const src=map.getSource('now-playing');if(!src)return;const lng=Number.isFinite(+s._displayLng)?+s._displayLng:+s.geo_long,lat=Number.isFinite(+s._displayLat)?+s._displayLat:+s.geo_lat;src.setData({type:'FeatureCollection',features:Number.isFinite(lng)&&Number.isFinite(lat)?[{type:'Feature',geometry:{type:'Point',coordinates:[lng,lat]},properties:{}}]:[]})}
function updatePlayer(){if(!current)return;$('#stationName').textContent=current.name||'Unknown station';$('#stationSub').textContent=[current.city,current.country,current.codec].filter(Boolean).join(' · ');$('#liveLabel').style.visibility='visible';$('#art').innerHTML=current.favicon?`<img src="${esc(current.favicon)}" onerror="this.parentElement.innerHTML='<span class=artFallback>◉</span>'">`:'<span class="artFallback">◉</span>';$('#favBtn').textContent=favorites.some(x=>x.stationuuid===current.stationuuid)?'♥':'♡';updateNowPoint(current)}
async function selectStation(s,fly=false){current=s;updatePlayer();recent=[s,...recent.filter(x=>x.stationuuid!==s.stationuuid)].slice(0,30);localStorage.setItem('worldio:recent',JSON.stringify(recent));const lng=Number.isFinite(+s._displayLng)?+s._displayLng:+s.geo_long,lat=Number.isFinite(+s._displayLat)?+s._displayLat:+s.geo_lat;if(fly&&Number.isFinite(lng)&&Number.isFinite(lat))map.easeTo({center:[lng,lat],zoom:Math.max(map.getZoom(),4.5),duration:800});audio.src=s.url_resolved||s.url;audio.volume=+$('#volume').value;try{await audio.play();$('#playBtn').textContent='Ⅱ';status(`${s.name} を再生中`)}catch(e){$('#playBtn').textContent='▶';toast('この局はブラウザで再生できません')}}
$('#playBtn').onclick=async()=>{if(!current)return toast('地球から局を選んでください');if(audio.paused){try{await audio.play();$('#playBtn').textContent='Ⅱ'}catch(e){toast('再生できません')}}else{audio.pause();$('#playBtn').textContent='▶'}};
$('#volume').oninput=e=>audio.volume=+e.target.value;
$('#favBtn').onclick=()=>{if(!current)return;const i=favorites.findIndex(x=>x.stationuuid===current.stationuuid);if(i>=0){favorites.splice(i,1);toast('お気に入りから削除')}else{favorites.unshift(current);toast('お気に入りに追加')}localStorage.setItem('worldio:favs',JSON.stringify(favorites.slice(0,100)));updatePlayer()};
$('#favListBtn').onclick=()=>renderList(favorites,'お気に入り');$('#closeSheet').onclick=()=>sheet.classList.remove('show');sheet.onclick=e=>{if(e.target===sheet)sheet.classList.remove('show')};
$('#searchForm').onsubmit=e=>{e.preventDefault();searchStations($('#search').value)};
$('#nearBtn').onclick=()=>{if(!stationPool.length)return toast('局を読み込み中です');const c=map.getCenter(),list=stationPool.map(s=>({s,d:distance(c.lat,c.lng,+s._displayLat,+s._displayLng)})).filter(x=>Number.isFinite(x.d)).sort((a,b)=>a.d-b.d).slice(0,50).map(x=>x.s);renderList(list,'この場所の近く')};
$('#randomBtn').onclick=()=>{if(!stationPool.length)return toast('局を読み込み中です');const weighted=stationPool.slice(0,Math.min(1000,stationPool.length));selectStation(weighted[Math.floor(Math.random()*weighted.length)],true)};
audio.addEventListener('playing',()=>$('#playBtn').textContent='Ⅱ');audio.addEventListener('pause',()=>$('#playBtn').textContent='▶');audio.addEventListener('error',()=>current&&toast('ストリーム接続に失敗しました'));
if('mediaSession'in navigator){audio.addEventListener('playing',()=>{if(!current)return;navigator.mediaSession.metadata=new MediaMetadata({title:current.name||'Worldio Radio',artist:[current.city,current.country].filter(Boolean).join(' · '),album:'Worldio'})});navigator.mediaSession.setActionHandler('play',()=>audio.play());navigator.mediaSession.setActionHandler('pause',()=>audio.pause())}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
