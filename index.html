<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#020706">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Worldio">
<title>Worldio — World Radio</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css">
<style>
:root{--bg:#020706;--panel:rgba(5,15,12,.88);--line:rgba(183,255,214,.14);--text:#f3fff8;--muted:#8fa69a;--green:#78ffb5}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body,#map{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:var(--text)}#map{position:fixed;inset:0}.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{display:none}.top{position:fixed;z-index:20;top:max(14px,env(safe-area-inset-top));left:13px;right:13px;display:flex;gap:9px}.brand,.search,.mini,.hud,.player{border:1px solid var(--line);background:rgba(3,10,8,.72);backdrop-filter:blur(22px)}.brand{height:45px;padding:0 13px;border-radius:23px;display:flex;align-items:center;gap:9px;font-size:15px;font-weight:900}.brandDot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 16px var(--green)}.searchWrap{position:relative;flex:1}.search{width:100%;height:45px;border-radius:23px;color:white;outline:0;padding:0 44px 0 16px;font-size:15px}.search::placeholder{color:#779185}.searchBtn{position:absolute;right:5px;top:5px;width:35px;height:35px;border:0;border-radius:18px;background:var(--green);color:#062116;font-size:18px;font-weight:900}.hud{position:fixed;z-index:18;left:50%;transform:translateX(-50%);top:max(70px,calc(env(safe-area-inset-top) + 60px));padding:7px 11px;border-radius:16px;font-size:11px;color:#b8cec3;max-width:84vw;white-space:nowrap}.side{position:fixed;z-index:18;right:12px;top:120px;display:flex;flex-direction:column;gap:8px}.mini{width:43px;height:43px;border-radius:50%;color:white;font-size:18px}.player{position:fixed;z-index:25;left:11px;right:11px;bottom:max(11px,env(safe-area-inset-bottom));border-radius:28px;padding:13px}.playerMain{display:flex;align-items:center;gap:11px}.art{width:58px;height:58px;border-radius:18px;background:radial-gradient(circle at 30% 25%,#90ffd0,#24a66e 42%,#0a3425 75%);display:grid;place-items:center;overflow:hidden;flex:none}.art img{width:100%;height:100%;object-fit:cover}.meta{flex:1;min-width:0}.name{font-size:16px;font-weight:820;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sub{font-size:11px;color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.btns{display:flex;gap:7px}.round,.play{border:1px solid var(--line);border-radius:50%}.round{width:42px;height:42px;background:rgba(255,255,255,.045);color:white;font-size:18px}.play{width:53px;height:53px;border:0;background:var(--green);color:#052216;font-size:21px;font-weight:900}.bar{display:flex;align-items:center;gap:9px;margin-top:10px}.bar span{font-size:10px;color:var(--muted)}.bar input{width:100%;accent-color:var(--green)}.sheet{position:fixed;z-index:40;inset:0;background:rgba(0,0,0,.42);display:none}.sheet.show{display:block}.panel{position:absolute;left:7px;right:7px;bottom:7px;max-height:72vh;overflow:auto;background:#071712;border:1px solid var(--line);border-radius:30px;padding:12px}.panelHead{display:flex;align-items:center;gap:8px;padding:3px 3px 9px}.panelTitle{flex:1;font-weight:850;font-size:18px}.chip{height:34px;padding:0 11px;border-radius:17px;border:1px solid var(--line);background:#0b271d;color:#dcf3e7}.result{display:flex;align-items:center;gap:11px;padding:10px 5px;border-top:1px solid var(--line)}.resultArt{width:45px;height:45px;border-radius:13px;background:#0c2a20;display:grid;place-items:center;overflow:hidden}.resultArt img{width:100%;height:100%;object-fit:cover}.resultMeta{flex:1;min-width:0}.resultName{font-size:14px;font-weight:760;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.resultSub{font-size:10px;color:var(--muted);margin-top:4px}.resultPlay{height:34px;padding:0 12px;border:0;border-radius:17px;background:var(--green);font-weight:850}.empty{padding:28px;text-align:center;color:var(--muted)}.bootError{position:fixed;z-index:80;left:20px;right:20px;top:42%;transform:translateY(-50%);padding:18px;border:1px solid rgba(255,255,255,.12);border-radius:22px;background:#07130f;text-align:center;display:none}.bootError button{margin-top:12px;height:40px;padding:0 18px;border:0;border-radius:20px;background:var(--green);font-weight:800}@media(min-width:720px){.player,.panel{left:auto;width:430px;right:18px}}
</style>
</head>
<body>
<div id="map"></div>
<div class="top"><div class="brand"><span class="brandDot"></span>WORLDIO</div><form class="searchWrap" id="searchForm"><input class="search" id="search" placeholder="局名・国・ジャンルを検索"><button class="searchBtn">⌕</button></form></div>
<div class="hud" id="hud">地球を起動しています… V3.1</div>
<div class="side"><button class="mini" id="nearBtn">◎</button><button class="mini" id="randomBtn">✦</button><button class="mini" id="favListBtn">♡</button></div>
<div class="player"><div class="playerMain"><div class="art" id="art">◉</div><div class="meta"><div class="name" id="stationName">地球から局を選んでください</div><div class="sub" id="stationSub">世界中のインターネットラジオ</div></div><div class="btns"><button class="round" id="favBtn">♡</button><button class="play" id="playBtn">▶</button></div></div><div class="bar"><span>VOL</span><input id="volume" type="range" min="0" max="1" value="0.85" step="0.01"></div></div>
<div class="sheet" id="sheet"><div class="panel"><div class="panelHead"><div class="panelTitle" id="panelTitle">Radio stations</div><button class="chip" id="closeSheet">閉じる</button></div><div id="results"></div></div></div>
<div class="bootError" id="bootError">地球エンジンを起動できませんでした。<br>通信状況を確認して再試行してください。<br><button onclick="location.reload()">再試行</button></div>
<audio id="audio" playsinline></audio>
<script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.1/dist/maplibre-gl.js'"></script>
<script>
const $=s=>document.querySelector(s),hud=$('#hud'),audio=$('#audio'),sheet=$('#sheet'),results=$('#results');
const API=['https://de1.api.radio-browser.info','https://nl1.api.radio-browser.info'];let apiIndex=0,map,mapReady=false,stations=[],current=null;let favorites=JSON.parse(localStorage.getItem('worldio:favs')||'[]');
const status=t=>hud.textContent=t;const esc=s=>String(s||'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
async function api(path){let last;for(let i=0;i<API.length;i++){const base=API[(apiIndex+i)%API.length];try{const c=new AbortController(),timer=setTimeout(()=>c.abort(),6500);const r=await fetch(base+path,{signal:c.signal,headers:{Accept:'application/json'}});clearTimeout(timer);if(!r.ok)throw Error(r.status);apiIndex=(apiIndex+i)%API.length;return await r.json()}catch(e){last=e}}throw last}
const baseStyle={version:8,sources:{},layers:[{id:'bg',type:'background',paint:{'background-color':'#06110d'}}]};
function bootMap(){try{if(!window.maplibregl)throw Error('MapLibre missing');map=new maplibregl.Map({container:'map',style:baseStyle,center:[12,25],zoom:1.55,attributionControl:false,dragRotate:false,touchPitch:false,minZoom:.6,maxZoom:10,fadeDuration:0});map.on('load',()=>{mapReady=true;try{map.setProjection({type:'globe'});map.setFog({color:'rgb(2,7,6)','high-color':'rgb(8,25,20)','horizon-blend':.08,'space-color':'rgb(0,2,2)','star-intensity':.24})}catch(e){}status('地球を表示しました · 局を読み込み中…');setTimeout(addBaseMap,50);setTimeout(loadStationsFast,120)});map.on('error',e=>console.warn('map',e?.error||e))}catch(e){console.error(e);showBootError()}}
function addBaseMap(){if(!mapReady||map.getSource('osm'))return;try{map.addSource('osm',{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,maxzoom:8});map.addLayer({id:'earth',type:'raster',source:'osm',paint:{'raster-opacity':.62,'raster-saturation':-.8,'raster-contrast':.2,'raster-brightness-max':.48}})}catch(e){console.warn('basemap',e)}}
function featureCollection(list){return{type:'FeatureCollection',features:list.filter(s=>Number.isFinite(+s.geo_lat)&&Number.isFinite(+s.geo_long)).map(s=>({type:'Feature',geometry:{type:'Point',coordinates:[+s.geo_long,+s.geo_lat]},properties:{id:s.stationuuid}}))}}
function showStations(){if(!mapReady||!stations.length)return;const data=featureCollection(stations);if(map.getSource('stations')){map.getSource('stations').setData(data);return}map.addSource('stations',{type:'geojson',data,cluster:true,clusterMaxZoom:7,clusterRadius:38});map.addLayer({id:'clusters',type:'circle',source:'stations',filter:['has','point_count'],paint:{'circle-color':'rgba(120,255,181,.28)','circle-radius':['step',['get','point_count'],11,20,15,60,20],'circle-stroke-width':1,'circle-stroke-color':'rgba(120,255,181,.8)'}});map.addLayer({id:'cluster-count',type:'symbol',source:'stations',filter:['has','point_count'],layout:{'text-field':['get','point_count_abbreviated'],'text-size':10},paint:{'text-color':'#e5fff1'}});map.addLayer({id:'station-glow',type:'circle',source:'stations',filter:['!',['has','point_count']],paint:{'circle-color':'rgba(120,255,181,.18)','circle-radius':['interpolate',['linear'],['zoom'],1,5,6,10],'circle-blur':.75}});map.addLayer({id:'station-points',type:'circle',source:'stations',filter:['!',['has','point_count']],paint:{'circle-color':'#78ffb5','circle-radius':['interpolate',['linear'],['zoom'],1,1.8,6,4.2]}});map.on('click','clusters',async e=>{const f=e.features[0],z=await map.getSource('stations').getClusterExpansionZoom(f.properties.cluster_id);map.easeTo({center:f.geometry.coordinates,zoom:Math.min(z,8),duration:550})});map.on('click','station-points',e=>{const s=stations.find(x=>x.stationuuid===e.features[0].properties.id);if(s)selectStation(s,true)})}
async function loadStationsFast(){const cached=localStorage.getItem('worldio:stations:v31');if(cached){try{stations=JSON.parse(cached);if(stations.length){showStations();status(`${stations.length.toLocaleString()}局を表示 · 最新情報を更新中…`)}}catch(e){}}try{const raw=await api('/json/stations/search?hidebroken=true&has_geo_info=true&order=clickcount&reverse=true&limit=900');stations=raw.filter(s=>s.stationuuid&&s.url_resolved&&Number.isFinite(+s.geo_lat)&&Number.isFinite(+s.geo_long));localStorage.setItem('worldio:stations:v31',JSON.stringify(stations));showStations();status(`${stations.length.toLocaleString()}局を表示 · 光点をタップ`);setTimeout(loadMoreStations,1200)}catch(e){if(stations.length)status(`${stations.length.toLocaleString()}局をキャッシュから表示`);else status('局データの取得に失敗しました')}}
async function loadMoreStations(){try{const more=await api('/json/stations/search?hidebroken=true&has_geo_info=true&order=clickcount&reverse=true&limit=1800');const merged=[...new Map([...stations,...more].filter(s=>s.stationuuid&&s.url_resolved&&Number.isFinite(+s.geo_lat)&&Number.isFinite(+s.geo_long)).map(s=>[s.stationuuid,s])).values()];stations=merged;showStations();localStorage.setItem('worldio:stations:v31',JSON.stringify(stations.slice(0,1800)));status(`${stations.length.toLocaleString()}局を表示 · 準備完了`)}catch(e){}}
function renderList(list,title){$('#panelTitle').textContent=title;results.innerHTML=list.length?list.slice(0,70).map(s=>`<div class="result"><div class="resultArt">${s.favicon?`<img src="${esc(s.favicon)}" onerror="this.remove()">`:'◉'}</div><div class="resultMeta"><div class="resultName">${esc(s.name)}</div><div class="resultSub">${esc([s.city,s.country].filter(Boolean).join(' · '))}</div></div><button class="resultPlay" data-id="${esc(s.stationuuid)}">▶</button></div>`).join(''):'<div class="empty">ラジオ局が見つかりません</div>';sheet.classList.add('show');results.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const s=[...stations,...favorites].find(x=>x.stationuuid===b.dataset.id);if(s){sheet.classList.remove('show');selectStation(s,true)}})}
async function searchStations(q){if(!q.trim())return;status(`「${q}」を検索中…`);try{const list=await api('/json/stations/search?hidebroken=true&limit=80&order=clickcount&reverse=true&name='+encodeURIComponent(q));renderList(list,`「${q}」の検索結果`);status(`${list.length}局見つかりました`)}catch(e){status('検索に失敗しました')}}
async function selectStation(s,fly){current=s;$('#stationName').textContent=s.name||'Unknown station';$('#stationSub').textContent=[s.city,s.country,s.codec].filter(Boolean).join(' · ');$('#art').innerHTML=s.favicon?`<img src="${esc(s.favicon)}" onerror="this.parentElement.textContent='◉'">`:'◉';$('#favBtn').textContent=favorites.some(x=>x.stationuuid===s.stationuuid)?'♥':'♡';if(fly&&mapReady)map.easeTo({center:[+s.geo_long,+s.geo_lat],zoom:Math.max(map.getZoom(),4.2),duration:700});audio.src=s.url_resolved||s.url;audio.volume=+$('#volume').value;try{await audio.play();$('#playBtn').textContent='Ⅱ';status(`${s.name} を再生中`)}catch(e){$('#playBtn').textContent='▶';status('この局は再生できませんでした')}}
$('#searchForm').onsubmit=e=>{e.preventDefault();searchStations($('#search').value)};$('#closeSheet').onclick=()=>sheet.classList.remove('show');sheet.onclick=e=>{if(e.target===sheet)sheet.classList.remove('show')};$('#favListBtn').onclick=()=>renderList(favorites,'お気に入り');$('#randomBtn').onclick=()=>stations.length&&selectStation(stations[Math.floor(Math.random()*stations.length)],true);$('#nearBtn').onclick=()=>{if(!mapReady||!stations.length)return;const c=map.getCenter(),d=(s)=>(+s.geo_lat-c.lat)**2+(+s.geo_long-c.lng)**2;renderList([...stations].sort((a,b)=>d(a)-d(b)).slice(0,50),'この場所の近く')};$('#favBtn').onclick=()=>{if(!current)return;const i=favorites.findIndex(x=>x.stationuuid===current.stationuuid);if(i>=0)favorites.splice(i,1);else favorites.unshift(current);favorites=favorites.slice(0,100);localStorage.setItem('worldio:favs',JSON.stringify(favorites));$('#favBtn').textContent=i>=0?'♡':'♥'};$('#playBtn').onclick=async()=>{if(!current)return;if(audio.paused){try{await audio.play();$('#playBtn').textContent='Ⅱ'}catch(e){}}else{audio.pause();$('#playBtn').textContent='▶'}};$('#volume').oninput=e=>audio.volume=+e.target.value;
function showBootError(){$('#bootError').style.display='block';status('地球の起動に失敗しました')}
setTimeout(()=>{if(!mapReady)showBootError()},5500);
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
bootMap();
</script>
</body>
</html>
