<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#030807">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Worldio">
<title>Worldio — World Radio</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css">
<style>
:root{--bg:#030807;--panel:rgba(5,16,13,.82);--line:rgba(183,255,214,.13);--text:#f3fff8;--muted:#91aa9e;--green:#78ffb5;--cyan:#76dcff;--danger:#ff7f89}*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:var(--text)}body:before{content:"";position:fixed;z-index:3;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 42%,transparent 12%,rgba(0,0,0,.06) 48%,rgba(0,0,0,.58) 100%)}#map{position:fixed;inset:0}.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{display:none}.top{position:fixed;z-index:20;top:max(14px,env(safe-area-inset-top));left:13px;right:13px;display:flex;align-items:center;gap:9px}.brand{height:45px;padding:0 13px;border-radius:23px;display:flex;align-items:center;gap:9px;background:rgba(3,10,8,.68);backdrop-filter:blur(22px);border:1px solid var(--line);font-size:15px;font-weight:900;letter-spacing:-.04em;box-shadow:0 10px 35px rgba(0,0,0,.2)}.brandDot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 16px var(--green)}.searchWrap{position:relative;flex:1}.search{width:100%;height:45px;border-radius:23px;border:1px solid var(--line);background:rgba(3,10,8,.7);backdrop-filter:blur(22px);color:white;outline:0;padding:0 44px 0 16px;font-size:15px;box-shadow:0 10px 35px rgba(0,0,0,.2)}.search::placeholder{color:#779185}.searchBtn{position:absolute;right:5px;top:5px;width:35px;height:35px;border:0;border-radius:18px;background:var(--green);color:#062116;font-weight:900;font-size:18px}.hud{position:fixed;z-index:16;left:50%;transform:translateX(-50%);top:max(70px,calc(env(safe-area-inset-top) + 60px));padding:7px 11px;border-radius:16px;border:1px solid var(--line);background:rgba(3,10,8,.66);backdrop-filter:blur(18px);font-size:11px;color:#b8cec3;max-width:82vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.25s}.side{position:fixed;z-index:18;right:12px;top:120px;display:flex;flex-direction:column;gap:8px}.mini{width:43px;height:43px;border-radius:50%;border:1px solid var(--line);background:rgba(3,10,8,.72);backdrop-filter:blur(18px);color:white;font-size:18px;box-shadow:0 8px 25px rgba(0,0,0,.22)}.player{position:fixed;z-index:25;left:11px;right:11px;bottom:max(11px,env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(8,25,19,.9),rgba(3,12,9,.95));border:1px solid var(--line);backdrop-filter:blur(30px);border-radius:28px;padding:13px 13px 12px;box-shadow:0 26px 75px rgba(0,0,0,.55)}.playerMain{display:flex;align-items:center;gap:11px}.art{width:58px;height:58px;border-radius:18px;background:radial-gradient(circle at 30% 25%,#90ffd0,#24a66e 42%,#0a3425 75%);display:grid;place-items:center;overflow:hidden;border:1px solid rgba(255,255,255,.1);flex:none}.art img{width:100%;height:100%;object-fit:cover}.artFallback{font-size:24px}.stationMeta{flex:1;min-width:0}.stationName{font-size:16px;font-weight:820;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stationSub{font-size:11px;color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.live{display:inline-flex;align-items:center;gap:5px;margin-top:5px;color:var(--green);font-size:10px;font-weight:800}.live i{width:6px;height:6px;background:var(--green);border-radius:50%;box-shadow:0 0 10px var(--green)}.playerBtns{display:flex;align-items:center;gap:7px}.round{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.045);color:#fff;font-size:18px}.play{width:53px;height:53px;border:0;border-radius:50%;background:var(--green);color:#052216;font-size:21px;font-weight:900;box-shadow:0 0 30px rgba(120,255,181,.22)}.bar{display:flex;align-items:center;gap:9px;margin-top:10px}.bar span{color:var(--muted);font-size:10px}.bar input{width:100%;accent-color:var(--green)}.sheet{position:fixed;z-index:40;inset:0;background:rgba(0,0,0,.38);display:none}.sheet.show{display:block}.panel{position:absolute;left:7px;right:7px;bottom:7px;max-height:72vh;overflow:auto;background:#071712;border:1px solid var(--line);border-radius:30px;padding:11px 11px calc(12px + env(safe-area-inset-bottom));box-shadow:0 30px 90px rgba(0,0,0,.7)}.handle{width:43px;height:5px;background:#315044;border-radius:5px;margin:3px auto 12px}.panelHead{display:flex;align-items:center;gap:8px;padding:0 3px 8px}.panelTitle{flex:1;font-weight:850;font-size:18px}.chip{height:34px;padding:0 11px;border-radius:17px;border:1px solid var(--line);background:#0b271d;color:#dcf3e7;font-size:12px}.result{display:flex;align-items:center;gap:11px;padding:10px 5px;border-top:1px solid var(--line)}.resultArt{width:45px;height:45px;border-radius:13px;background:#0c2a20;display:grid;place-items:center;overflow:hidden;flex:none}.resultArt img{width:100%;height:100%;object-fit:cover}.resultMeta{flex:1;min-width:0}.resultName{font-size:14px;font-weight:760;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.resultSub{font-size:10px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.resultPlay{height:34px;padding:0 12px;border:0;border-radius:17px;background:var(--green);color:#052216;font-size:12px;font-weight:850}.empty{padding:30px 10px;text-align:center;color:var(--muted);font-size:13px}.toast{position:fixed;z-index:60;left:50%;bottom:158px;transform:translate(-50%,15px);padding:9px 13px;border-radius:18px;background:#edfdf5;color:#09261b;font-weight:750;font-size:12px;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 12px 38px rgba(0,0,0,.3)}.toast.show{opacity:1;transform:translate(-50%,0)}@media(min-width:720px){.player,.panel{left:auto;width:430px;right:18px}.top{left:18px;right:18px}.searchWrap{max-width:430px;margin-left:auto}.toast{bottom:28px}}
</style>
</head>
<body>
<div id="map"></div>
<div class="top"><div class="brand"><span class="brandDot"></span>WORLDIO</div><form class="searchWrap" id="searchForm"><input class="search" id="search" placeholder="局名・国・ジャンルを検索" autocomplete="off"><button class="searchBtn" aria-label="検索">⌕</button></form></div>
<div class="hud" id="hud">世界のラジオ局を読み込んでいます…</div>
<div class="side"><button class="mini" id="nearBtn" aria-label="この場所の局">◎</button><button class="mini" id="randomBtn" aria-label="ランダム">✦</button><button class="mini" id="favListBtn" aria-label="お気に入り">♡</button></div>
<div class="player"><div class="playerMain"><div class="art" id="art"><span class="artFallback">◉</span></div><div class="stationMeta"><div class="stationName" id="stationName">地球から局を選んでください</div><div class="stationSub" id="stationSub">世界中のインターネットラジオ</div><div class="live" id="liveLabel" style="visibility:hidden"><i></i>LIVE</div></div><div class="playerBtns"><button class="round" id="favBtn">♡</button><button class="play" id="playBtn">▶</button></div></div><div class="bar"><span>VOL</span><input id="volume" type="range" min="0" max="1" value="0.85" step="0.01"></div></div>
<div class="sheet" id="sheet"><div class="panel"><div class="handle"></div><div class="panelHead"><div class="panelTitle" id="panelTitle">Radio stations</div><button class="chip" id="closeSheet">閉じる</button></div><div id="results"></div></div></div>
<div class="toast" id="toast"></div>
<audio id="audio" playsinline></audio>
<script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
<script>
const MIRROR_BOOT='https://de1.api.radio-browser.info';
let mirrors=[MIRROR_BOOT,'https://nl1.api.radio-browser.info'];
let mirrorIndex=0, stationPool=[], current=null, mapReady=false, markersLoaded=false;
const $=s=>document.querySelector(s);const audio=$('#audio'),hud=$('#hud'),sheet=$('#sheet'),results=$('#results');
let favorites=JSON.parse(localStorage.getItem('worldio:favs')||'[]');let recent=JSON.parse(localStorage.getItem('worldio:recent')||'[]');
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1700)}
function status(t){hud.textContent=t}function esc(s){return String(s||'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
async function api(path,opts={}){let last;for(let i=0;i<mirrors.length;i++){const base=mirrors[(mirrorIndex+i)%mirrors.length];try{const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),9000);const r=await fetch(base+path,{...opts,signal:ctrl.signal,headers:{Accept:'application/json',...(opts.headers||{})}});clearTimeout(timer);if(!r.ok)throw Error(r.status);mirrorIndex=(mirrorIndex+i)%mirrors.length;return await r.json()}catch(e){last=e}}throw last||Error('API unavailable')}
async function discoverMirrors(){try{const list=await api('/json/servers');const found=[...new Set(list.map(x=>x.name).filter(Boolean).map(n=>'https://'+n))];if(found.length)mirrors=found.sort(()=>Math.random()-.5)}catch(e){}}
const map=new maplibregl.Map({container:'map',style:'https://demotiles.maplibre.org/style.json',center:[12,25],zoom:1.65,pitch:0,bearing:0,attributionControl:false,dragRotate:false,touchPitch:false});
map.on('load',()=>{mapReady=true;try{map.setProjection({type:'globe'});map.setFog({color:'rgb(3,8,7)','high-color':'rgb(8,25,20)','horizon-blend':0.08,'space-color':'rgb(1,3,3)','star-intensity':.28})}catch(e){};if(stationPool.length)addStationsToMap()});
function stationGeoJson(){return{type:'FeatureCollection',features:stationPool.filter(s=>Number.isFinite(+s.geo_lat)&&Number.isFinite(+s.geo_long)).map(s=>({type:'Feature',geometry:{type:'Point',coordinates:[+s.geo_long,+s.geo_lat]},properties:{id:s.stationuuid,name:s.name,country:s.countrycode||'',favicon:s.favicon||''}}))}}
function addStationsToMap(){if(!mapReady)return;const data=stationGeoJson();if(map.getSource('stations')){map.getSource('stations').setData(data);return}map.addSource('stations',{type:'geojson',data,cluster:true,clusterMaxZoom:7,clusterRadius:38});map.addLayer({id:'clusters',type:'circle',source:'stations',filter:['has','point_count'],paint:{'circle-color':'rgba(120,255,181,.25)','circle-radius':['step',['get','point_count'],12,15,16,40,21],'circle-stroke-width':1,'circle-stroke-color':'rgba(120,255,181,.8)'}});map.addLayer({id:'cluster-count',type:'symbol',source:'stations',filter:['has','point_count'],layout:{'text-field':['get','point_count_abbreviated'],'text-size':10},paint:{'text-color':'#dffff0'}});map.addLayer({id:'station-points',type:'circle',source:'stations',filter:['!',['has','point_count']],paint:{'circle-color':'#78ffb5','circle-radius':['interpolate',['linear'],['zoom'],1,2.2,6,5.2],'circle-blur':.15,'circle-stroke-color':'rgba(120,255,181,.24)','circle-stroke-width':['interpolate',['linear'],['zoom'],1,3,6,8]}});map.on('click','clusters',async e=>{const f=e.features[0];const zoom=await map.getSource('stations').getClusterExpansionZoom(f.properties.cluster_id);map.easeTo({center:f.geometry.coordinates,zoom:Math.min(zoom,8)})});map.on('click','station-points',e=>{const id=e.features[0].properties.id;const s=stationPool.find(x=>x.stationuuid===id);if(s)selectStation(s,true)});map.on('mouseenter','station-points',()=>map.getCanvas().style.cursor='pointer');map.on('mouseleave','station-points',()=>map.getCanvas().style.cursor='');markersLoaded=true}
async function loadPool(){status('世界のラジオ局を読み込み中…');try{await discoverMirrors();stationPool=await api('/json/stations/search?hidebroken=true&has_geo_info=true&order=clickcount&reverse=true&limit=3500');stationPool=stationPool.filter(s=>s.stationuuid&&s.url_resolved);addStationsToMap();status(`${stationPool.length.toLocaleString()}局を地球に表示 · 光点をタップ`)}catch(e){status('局データを取得できません。再読み込みしてください')}}
function distance(a,b,c,d){const R=6371,rad=x=>x*Math.PI/180;const x=rad(c-a),y=rad(d-b);const z=Math.sin(x/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(z))}
function nearest(){const c=map.getCenter();return stationPool.filter(s=>s.geo_lat!=null&&s.geo_long!=null).map(s=>({...s,_d:distance(c.lat,c.lng,+s.geo_lat,+s.geo_long)})).sort((a,b)=>a._d-b._d).slice(0,30)}
function showList(list,title){$('#panelTitle').textContent=title;results.innerHTML='';if(!list.length){results.innerHTML='<div class="empty">該当する局がありません</div>';sheet.classList.add('show');return}list.slice(0,40).forEach(s=>{const row=document.createElement('div');row.className='result';const img=s.favicon?`<img src="${esc(s.favicon)}" onerror="this.remove()">`:'◉';row.innerHTML=`<div class="resultArt">${img}</div><div class="resultMeta"><div class="resultName">${esc(s.name)}</div><div class="resultSub">${esc([s.countrycode,s.state,s.codec,s.bitrate?`${s.bitrate}kbps`:null].filter(Boolean).join(' · '))}</div></div><button class="resultPlay">再生</button>`;row.querySelector('button').onclick=()=>selectStation(s,true);results.appendChild(row)});sheet.classList.add('show')}
function isFav(s){return !!s&&favorites.some(x=>x.stationuuid===s.stationuuid)}function updateFav(){if(current)$('#favBtn').textContent=isFav(current)?'♥':'♡'}
function updateArt(s){const a=$('#art');a.innerHTML=s.favicon?`<img src="${esc(s.favicon)}" onerror="this.parentNode.innerHTML='<span class=artFallback>◉</span>'">`:'<span class="artFallback">◉</span>'}
async function selectStation(s,autoplay=false){current=s;$('#stationName').textContent=s.name||'Unknown station';$('#stationSub').textContent=[s.countrycode,s.state,s.codec,s.bitrate?`${s.bitrate}kbps`:null].filter(Boolean).join(' · ')||'Internet radio';updateArt(s);updateFav();$('#liveLabel').style.visibility='hidden';recent=[s,...recent.filter(x=>x.stationuuid!==s.stationuuid)].slice(0,30);localStorage.setItem('worldio:recent',JSON.stringify(recent));if(s.geo_lat!=null&&s.geo_long!=null&&mapReady)map.easeTo({center:[+s.geo_long,+s.geo_lat],zoom:Math.max(map.getZoom(),4.5),duration:900});audio.src=s.url_resolved||s.url;sheet.classList.remove('show');if(autoplay){status('接続中 · '+s.name);try{await audio.play();$('#playBtn').textContent='❚❚';$('#liveLabel').style.visibility='visible';status('LIVE · '+s.name);api('/json/url/'+encodeURIComponent(s.stationuuid)).catch(()=>{})}catch(e){status('この局はiPhoneで再生できません · 別の局を選択');toast('再生できないストリームです')}}}
$('#playBtn').onclick=async()=>{if(!current){showList(nearest(),'近くのラジオ局');return}if(audio.paused){try{await audio.play();$('#playBtn').textContent='❚❚';$('#liveLabel').style.visibility='visible';status('LIVE · '+current.name)}catch(e){toast('再生できません')}}else{audio.pause();$('#playBtn').textContent='▶';$('#liveLabel').style.visibility='hidden';status('一時停止')}};audio.onplaying=()=>{$('#playBtn').textContent='❚❚';$('#liveLabel').style.visibility='visible'};audio.onpause=()=>{$('#playBtn').textContent='▶';$('#liveLabel').style.visibility='hidden'};audio.onerror=()=>{if(current){status('ストリーム接続失敗 · 別の局を選んでください');$('#playBtn').textContent='▶';$('#liveLabel').style.visibility='hidden'}};$('#volume').oninput=e=>audio.volume=+e.target.value;audio.volume=.85;
$('#favBtn').onclick=()=>{if(!current)return;if(isFav(current)){favorites=favorites.filter(x=>x.stationuuid!==current.stationuuid);toast('お気に入りから削除')}else{favorites.unshift(current);favorites=favorites.slice(0,100);toast('お気に入りに追加')}localStorage.setItem('worldio:favs',JSON.stringify(favorites));updateFav()};$('#favListBtn').onclick=()=>showList(favorites,'お気に入り');$('#nearBtn').onclick=()=>showList(nearest(),'この場所の近く');$('#randomBtn').onclick=()=>{if(!stationPool.length)return;selectStation(stationPool[Math.floor(Math.random()*stationPool.length)],true)};$('#closeSheet').onclick=()=>sheet.classList.remove('show');sheet.onclick=e=>{if(e.target===sheet)sheet.classList.remove('show')};
$('#searchForm').onsubmit=async e=>{e.preventDefault();const q=$('#search').value.trim();if(!q)return;status('検索中 · '+q);try{let list=await api('/json/stations/search?hidebroken=true&limit=40&order=clickcount&reverse=true&name='+encodeURIComponent(q));if(list.length<8){const byCountry=await api('/json/stations/search?hidebroken=true&limit=30&order=clickcount&reverse=true&country='+encodeURIComponent(q)).catch(()=>[]);const byTag=await api('/json/stations/search?hidebroken=true&limit=30&order=clickcount&reverse=true&tag='+encodeURIComponent(q)).catch(()=>[]);const m=new Map([...list,...byCountry,...byTag].map(s=>[s.stationuuid,s]));list=[...m.values()].slice(0,40)}showList(list,`検索 · ${q}`);status(`${list.length}局見つかりました`)}catch(e){status('検索に失敗しました');toast('通信エラー')}};
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));loadPool();
</script>
</body>
</html>
