<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#020706">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Worldio">
<meta name="description" content="地球を回して世界のラジオに出会う Worldio">
<title>Worldio — World Radio</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="preconnect" href="https://de1.api.radio-browser.info" crossorigin>
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css"></noscript>
</head>
<body>
<div id="map" aria-label="世界ラジオ地球儀"></div>
<header class="top">
  <div class="brand glass"><span class="brandDot"></span>WORLDIO</div>
  <form class="searchWrap" id="searchForm"><input class="search glass" id="search" placeholder="局名・国・ジャンルを検索" autocomplete="off" inputmode="search" aria-label="ラジオ局を検索"><button class="searchBtn" aria-label="検索">⌕</button></form>
</header>
<div class="hud glass" id="hud" role="status">Worldioを起動しています…</div>
<nav class="side" aria-label="地球操作">
  <button class="mini glass" id="nearBtn" aria-label="この場所の近く">◎</button>
  <button class="mini glass" id="randomBtn" aria-label="ランダム再生">✦</button>
  <button class="mini glass" id="favListBtn" aria-label="お気に入り">♡</button>
</nav>
<section class="player glass" aria-label="プレイヤー">
  <div class="playerMain">
    <div class="art" id="art">◉</div>
    <div class="meta"><div class="name" id="stationName">地球から局を選んでください</div><div class="sub" id="stationSub">世界中のインターネットラジオ</div><div class="state" id="playState"></div></div>
    <div class="btns"><button class="round" id="favBtn" aria-label="お気に入り切替">♡</button><button class="play" id="playBtn" aria-label="再生・停止">▶</button></div>
  </div>
  <div class="bar"><span>VOL</span><input id="volume" type="range" min="0" max="1" value="0.85" step="0.01" aria-label="音量"></div>
</section>
<div class="sheet" id="sheet"><div class="panel"><div class="panelHead"><div class="panelTitle" id="panelTitle">Radio stations</div><button class="chip" id="closeSheet">閉じる</button></div><div id="results"></div></div></div>
<div class="bootError" id="bootError"><strong>地球を起動できませんでした</strong><br><span data-message>通信状況を確認してください。</span><br><button id="retryBoot">再試行</button></div>
<div class="toast" id="toast"></div>
<audio id="audio" playsinline preload="none"></audio>
<script type="module" src="./src/app.js"></script>
</body>
</html>
