on:fixed;z-index:18;right:12px;top:120px;display:flex;flex-direction:column;gap:8px}.mini{width:43px;height:43px;border-radius:50%;border:1px solid var(--line);background:rgba(3,10,8,.72);backdrop-filter:blur(18px);color:white;font-size:18px;box-shadow:0 8px 25px rgba(0,0,0,.22)}.player{position:fixed;z-index:25;left:11px;right:11px;bottom:max(11px,env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(8,25,19,.9),rgba(3,12,9,.95));border:1px solid var(--line);backdrop-filter:blur(30px);border-radius:28px;padding:13px 13px 12px;box-shadow:0 26px 75px rgba(0,0,0,.55)}.playerMain{display:flex;align-items:center;gap:11px}.art{width:58px;height:58px;border-radius:18px;background:radial-gradient(circle at 30% 25%,#eafff5,var(--green) 42%,#0a3425 75%);display:grid;place-items:center;overflow:hidden;border:1px solid rgba(255,255,255,.1);flex:none}.art img{width:100%;height:100%;object-fit:cover}.artFallback{font-size:24px}.stationMeta{flex:1;min-width:0}.stationName{font-size:16px;font-weight:820;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stationSub{font-size:11px;color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.live{display:inline-flex;align-items:center;gap:5px;margin-top:5px;color:var(--green);font-size:10px;font-weight:800}.live i{width:6px;height:6px;background:var(--green);border-radius:50%;box-shadow:0 0 10px var(--green)}.playerBtns{display:flex;align-items:center;gap:7px}.round{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.045);color:#fff;font-size:18px}.play{width:53px;height:53px;border:0;border-radius:50%;background:var(--green);color:#052216;font-size:21px;font-weight:900;box-shadow:0 0 30px color-mix(in srgb,var(--green) 28%,transparent)}.bar{display:flex;align-items:center;gap:9px;margin-top:10px}.bar span{color:var(--muted);font-size:10px}.bar input{width:100%;accent-color:var(--green)}.sheet{position:fixed;z-index:40;inset:0;background:rgba(0,0,0,.38);display:none}.sheet.show{display:block}.panel{position:absolute;left:7px;right:7px;bottom:7px;max-height:72vh;overflow:auto;background:#071712;border:1px solid var(--line);border-radius:30px;padding:11px 11px calc(12px + env(safe-area-inset-bottom));box-shadow:0 30px 90px rgba(0,0,0,.7)}.handle{width:43px;height:5px;background:#315044;border-radius:5px;margin:3px auto 12px}.panelHead{display:flex;align-items:center;gap:8px;padding:0 3px 8px}.panelTitle{flex:1;font-weight:850;font-size:18px}.chip{height:34px;padding:0 11px;border-radius:17px;border:1px solid var(--line);background:#0b271d;color:#dcf3e7;font-size:12px}.result{display:flex;align-items:center;gap:11px;padding:10px 5px;border-top:1px solid var(--line)}.resultArt{width:45px;height:45px;border-radius:13px;background:#0c2a20;display:grid;place-items:center;overflow:hidden;flex:none}.resultArt img{width:100%;height:100%;object-fit:cover}.resultMeta{flex:1;min-width:0}.resultName{font-size:14px;font-weight:760;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.resultSub{font-size:10px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.resultPlay{height:34px;padding:0 12px;border:0;border-radius:17px;background:var(--green);color:#052216;font-size:12px;font-weight:850}.empty{padding:30px 10px;text-align:center;color:var(--muted);font-size:13px}.toast{position:fixed;z-index:60;left:50%;bottom:158px;transform:translate(-50%,15px);padding:9px 13px;border-radius:18px;background:#edfdf5;color:#09261b;font-weight:750;font-size:12px;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 12px 38px rgba(0,0,0,.3)}.toast.show{opacity:1;transform:translate(-50%,0)}.themeIntro{padding:8px 5px 14px;color:var(--muted);font-size:12px;line-height:1.6}.themeGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:4px}.themeSwatch{aspect-ratio:1;border-radius:18px;border:2px solid rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);position:relative}.themeSwatch.active:after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;color:white;font-size:20px;font-weight:900;text-shadow:0 2px 8px #000}.themeCustom{margin:14px 4px 4px;padding:12px;border:1px solid var(--line);border-radius:18px;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.035)}.themeCustom label{flex:1;font-size:13px;font-weight:750}.themeCustom small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.themeCustom input{width:52px;height:42px;border:0;padding:0;background:transparent}.themeReset{margin:8px 4px 2px;width:calc(100% - 8px);height:42px;border-radius:21px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:white;font-weight:750}.settingsBox{margin:14px 4px 4px;padding:12px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.035)}.settingsRow{display:flex;align-items:center;gap:12px}.settingsCopy{flex:1;min-width:0;font-size:13px;font-weight:750}.settingsCopy small{display:block;color:var(--muted);font-size:10px;line-height:1.45;margin-top:3px}.switch{position:relative;width:50px;height:30px;flex:none}.switch input{position:absolute;opacity:0;pointer-events:none}.switch span{position:absolute;inset:0;border-radius:18px;background:#294139;border:1px solid var(--line);transition:.2s}.switch span:after{content:'';position:absolute;width:24px;height:24px;left:2px;top:2px;border-radius:50%;background:#dce8e2;transition:.2s}.switch input:checked+span{background:var(--green)}.switch input:checked+span:after{transform:translateX(20px);background:#062116}.sunVisual{position:fixed;z-index:12;width:58px;height:58px;border-radius:50%;pointer-events:none;opacity:0;transform:translate(-50%,-50%);transition:opacity .2s;background:radial-gradient(circle at 36% 32%,#fffef0 0 8%,#fff8b6 22%,#ffd95d 52%,#f6a928 76%,#d97716 100%);border:1px solid rgba(255,242,177,.85);box-shadow:0 0 12px rgba(255,245,190,.9),0 0 34px rgba(255,203,79,.72),0 0 78px rgba(255,164,38,.34)}.sunVisual:after{content:'';position:absolute;inset:-18px;border-radius:50%;background:radial-gradient(circle,rgba(255,210,95,.20),transparent 68%)}@media(min-width:720px){.player,.panel{left:auto;width:430px;right:18px}.top{left:18px;right:18px}.searchWrap{max-width:430px;margin-left:auto}.toast{bottom:28px}}

<body>
<div id="map"></div><div class="sunVisual" id="sunVisual" aria-hidden="true"></div>
<div class="top"><div class="brand" id="themeBtn" role="button" tabindex="0" aria-label="テーマカラーを変更"><span class="brandDot"></span>WORLDIO</div><form class="searchWrap" id="searchForm"><input class="search" id="search" placeholder="局名・国・ジャンルを検索" autocomplete="off"><button class="searchBtn" aria-label="検索">⌕</button></form></div>
<div class="hud" id="hud">世界のラジオ局を読み込んでいます…</div>
<div class="side"><button class="mini" id="nearBtn" aria-label="この場所の局">◎</button><button class="mini" id="randomBtn" aria-label="ランダム">✦</button><button class="mini" id="favListBtn" aria-label="お気に入り">♡</button></div>
<div class="player"><div class="playerMain"><div class="art" id="art"><span class="artFallback">◉</span></div><div class="stationMeta"><div class="stationName" id="stationName">地球から局を選んでください</div><div class="stationSub" id="stationSub">世界中のインターネットラジオ</div><div class="live" id="liveLabel" style="visibility:hidden"><i></i>LIVE</div></div><div class="playerBtns"><button class="round" id="favBtn">♡</button><button class="play" id="playBtn">▶</button></div></div><div class="bar"><span>VOL</span><input id="volume" type="range" min="0" max="1" value="0.85" step="0.01"></div></div>
<div class="sheet" id="sheet"><div class="panel"><div class="handle"></div><div class="panelHead"><div class="panelTitle" id="panelTitle">Radio stations</div><button class="chip" id="closeSheet">閉じる</button></div><div id="results"></div></div></div>

<script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
<script>
const MIRROR_BOOT='https://de1.api.radio-browser.info';
let mirrors=[MIRROR_BOOT,'https://nl1.api.radio-browser.info'];
let mirrorIndex=0, stationPool=[], current=null, mapReady=false, markersLoaded=false;
const $=s=>document.querySelector(s);const audio=$('#audio'),hud=$('#hud'),sheet=$('#sheet'),results=$('#results');
let favorites=JSON.parse(localStorage.getItem('worldio:favs')||'[]');let recent=JSON.parse(localStorage.getItem('worldio:recent')||'[]');
let themeColor=localStorage.getItem('worldio:theme')||'#78ffb5';document.documentElement.style.setProperty('--green',themeColor);let dayNightEnabled=localStorage.getItem('worldio:daynight')!=='off';let solarTimer=null;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1700)}
function status(t){hud.textContent=t}function esc(s){return String(s||'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
function hexRgb(hex){const h=hex.replace('#','');return{r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)}}function rgba(hex,a){const c=hexRgb(hex);return`rgba(${c.r},${c.g},${c.b},${a})`}
function syncMapTheme(){if(!mapReady)return;try{if(map.getLayer('clusters')){map.setPaintProperty('clusters','circle-color',rgba(themeColor,.25));map.setPaintProperty('clusters','circle-stroke-color',rgba(themeColor,.82))}if(map.getLayer('station-points')){map.setPaintProperty('station-points','circle-color',themeColor);map.setPaintProperty('station-points','circle-stroke-color',rgba(themeColor,.26))}if(map.getLayer('now-playing-glow')){map.setPaintProperty('now-playing-glow','circle-color',themeColor);map.setPaintProperty('now-playing-glow','circle-stroke-color',themeColor)}if(map.getLayer('now-playing-core'))map.setPaintProperty('now-playing-core','circle-stroke-color',themeColor)}catch(e){}}
function applyTheme(color,save=true){themeColor=color;document.documentElement.style.setProperty('--green',color);if(save)localStorage.setItem('worldio:theme',color);syncMapTheme()}
const THEME_PRESETS=['#78ffb5','#65d9ff','#5f8cff','#a477ff','#ff72d0','#ff8b5e','#ffd45f','#f4f7ff'];
function showTheme(){const current=themeColor.toLowerCase();$('#panelTitle').textContent='Worldio Settings';results.innerHTML=`<div class="themeIntro">表示とテーマを自分好みに調整できます。</div><div class="settingsBox"><div class="settingsRow"><div class="settingsCopy">リアルタイム天文表示<small>実時刻の太陽方向から薄明帯・夜側・太陽の見え方を同期。太陽はカメラ追従しません</small></div><label class="switch" aria-label="リアルタイム昼夜境界"><input id="dayNightToggle" type="checkbox" ${dayNightEnabled?'checked':''}><span></span></label></div></div><div class="themeIntro" style="padding-bottom:6px">テーマカラー</div><div class="themeGrid">${THEME_PRESETS.map(c=>`<button class="themeSwatch ${current===c?'active':''}" data-theme="${c}" style="background:${c}" aria-label="${c}"></button>`).join('')}</div><div class="themeCustom"><label>カスタムカラー<small>好きな色を自由に選択</small></label><input id="themePicker" type="color" value="${themeColor}"></div><button class="themeReset" id="themeReset">初代グリーンに戻す</button>`;sheet.classList.add('show');results.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{applyTheme(b.dataset.theme);showTheme()});$('#themePicker').oninput=e=>applyTheme(e.target.value);$('#themeReset').onclick=()=>{applyTheme('#78ffb5');showTheme();toast('初代グリーンに戻しました')};$('#dayNightToggle').onchange=e=>{dayNightEnabled=e.target.checked;localStorage.setItem('worldio:daynight',dayNightEnabled?'on':'off');syncDayNight();toast(dayNightEnabled?'昼夜境界を表示':'昼夜境界を非表示')}}
async function api(path,opts={}){let last;for(let i=0;i<mirrors.length;i++){const base=mirrors[(mirrorIndex+i)%mirrors.length];try{const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),9000);const r=await fetch(base+path,{...opts,signal:ctrl.signal,headers:{Accept:'application/json',...(opts.headers||{})}});clearTimeout(timer);if(!r.ok)throw Error(r.status);mirrorIndex=(mirrorIndex+i)%mirrors.length;return await r.json()}catch(e){last=e}}throw last||Error('API unavailable')}
async function discoverMirrors(){try{const list=await api('/json/servers');const found=[...new Set(list.map(x=>x.name).filter(Boolean).map(n=>'https://'+n))];if(found.length)mirrors=found.sort(()=>Math.random()-.5)}catch(e){}}
function solarSubpoint(date=new Date()){const jd=date.getTime()/86400000+2440587.5,T=(jd-2451545)/36525,L=(280.46646+T*(36000.76983+T*.0003032))%360,M=357.52911+T*(35999.05029-.0001537*T),Mr=M*Math.PI/180,C=(1.914602-T*(.004817+.000014*T))*Math.sin(Mr)+(.019993-.000101*T)*Math.sin(2*Mr)+.000289*Math.sin(3*Mr),lambda=(L+C-0.00569-0.00478*Math.sin((125.04-1934.136*T)*Math.PI/180))*Math.PI/180,eps=(23.439291-.0130042*T)*Math.PI/180,dec=Math.asin(Math.sin(eps)*Math.sin(lambda))*180/Math.PI;const y=Math.tan(eps/2)**2,Lr=L*Math.PI/180,E=4*(y*Math.sin(2*Lr)-2*.016708634*Math.sin(Mr)+4*.016708634*y*Math.sin(Mr)*Math.cos(2*Lr)-.5*y*y*Math.sin(4*Lr)-1.25*.016708634*.016708634*Math.sin(2*Mr))*180/Math.PI;const mins=date.getUTCHours()*60+date.getUTCMinutes()+date.getUTCSeconds()/60,lon=((720-mins-E)/4+540)%360-180;return{lat:dec,lon}}
function solarAltitudeBoundaryGeoJson(altitudeDeg){const s=solarSubpoint(),dec=s.lat*Math.PI/180,h=Math.sin(altitudeDeg*Math.PI/180),ring=[];for(let lon=-180;lon<=180;lon+=2){const H=(lon-s.lon)*Math.PI/180,A=Math.cos(dec)*Math.cos(H),B=Math.sin(dec),R=Math.hypot(A,B);if(R<1e-9)continue;const v=Math.max(-1,Math.min(1,h/R)),phi=Math.asin(v)-Math.atan2(B,A),lat=Math.max(-90,Math.min(90,phi*180/Math.PI));ring.push([lon,lat])}const cap=s.lat>=0?-90:90;ring.push([180,cap],[-180,cap],ring[0]);return{type:'FeatureCollection',features:[{type:'Feature',properties:{altitude:altitudeDeg},geometry:{type:'Polygon',coordinates:[ring]}}]}}
function ensureDayNight(){if(!mapReady)return;const before=map.getLayer('clusters')?'clusters':undefined;const defs=[['twilight-18',-18,'#02040b',.08],['twilight-12',-12,'#10132b',.07],['twilight-6',-6,'#3d3157',.06],['night-side',0,'#000611',.24]];for(const [id,alt,color,opacity] of defs){if(!map.getSource(id))map.addSource(id,{type:'geojson',data:solarAltitudeBoundaryGeoJson(alt)});if(!map.getLayer(id+'-fill'))map.addLayer({id:id+'-fill',type:'fill',source:id,paint:{'fill-color':color,'fill-opacity':opacity}},before)}if(!map.getLayer('terminator-line'))map.addLayer({id:'terminator-line',type:'line',source:'night-side',paint:{'line-color':'#ffd978','line-opacity':.24,'line-width':1}},before)}
function angularDistanceDeg(aLon,aLat,bLon,bLat){const r=Math.PI/180,p1=aLat*r,p2=bLat*r,dl=(bLon-aLon)*r;return Math.acos(Math.max(-1,Math.min(1,Math.sin(p1)*Math.sin(p2)+Math.cos(p1)*Math.cos(p2)*Math.cos(dl))))/r}
/* AstronomySystem visual projection.
   The Sun direction comes only from UTC/date (solarSubpoint) and the Earth-facing camera state.
   It is never moved to a fixed screen ring and is never forced to remain visible.
   When the Sun is on the far hemisphere it is occluded by Earth. */
function updateSunVisual(){const el=$('#sunVisual');if(!el||!mapReady||!dayNightEnabled){if(el)el.style.opacity='0';return}const s=solarSubpoint(),center=map.getCenter(),separation=angularDistanceDeg(center.lng,center.lat,s.lon,s.lat),p=map.project([s.lon,s.lat]),rect=map.getContainer().getBoundingClientRect(),cx=rect.width/2,cy=rect.height/2,dx=p.x-cx,dy=p.y-cy,projected=Math.hypot(dx,dy);if(!Number.isFinite(projected)){el.style.opacity='0';return}const earthRadius=Math.min(rect.width,rect.height)*.39,rad=separation*Math.PI/180,sceneDistance=2.65,depth=Math.cos(rad),radial=earthRadius*sceneDistance*Math.sin(rad),len=projected||1,x=cx+(dx/len)*radial,y=cy+(dy/len)*radial,screenDist=Math.hypot(x-cx,y-cy),sunDiameter=60,sunRadius=sunDiameter/2,margin=90;
/* Continuous astronomical projection: the Sun never jumps or gets deleted merely
   because it crosses the camera-opposite hemisphere. */
el.style.left=x+'px';el.style.top=y+'px';
/* Eclipse-style Earth occlusion.  On the far side, clip the Sun by the projected
   Earth disc instead of toggling opacity.  The circle therefore disappears limb
   first, remains hidden behind Earth, then grows back from the opposite limb. */
if(depth<0&&screenDist<earthRadius+sunRadius){
  const ux=(x-cx)/(screenDist||1),uy=(y-cy)/(screenDist||1),earthEdgeX=cx+ux*earthRadius,earthEdgeY=cy+uy*earthRadius;
  const edgeLocalX=earthEdgeX-(x-sunRadius),edgeLocalY=earthEdgeY-(y-sunRadius);
  const nx=ux,ny=uy,keepPositive=(x-cx)*nx+(y-cy)*ny>=0;
  /* Half-plane tangent approximation at the globe limb gives a smooth eclipse
     transition while the globe itself remains the visual foreground object. */
  const A=nx,B=ny,C=-(nx*edgeLocalX+ny*edgeLocalY);
  const pts=[[0,0],[sunDiameter,0],[sunDiameter,sunDiameter],[0,sunDiameter]];
  const inside=q=>(A*q[0]+B*q[1]+C)*(keepPositive?1:-1)>=0;
  const out=[];
  for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length],ia=inside(a),ib=inside(b);if(ia)out.push(a);if(ia!==ib){const da=A*a[0]+B*a[1]+C,db=A*b[0]+B*b[1]+C,t=da/(da-db);out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t])}}
  if(!out.length){el.style.opacity='0';el.style.clipPath='none';return}
  el.style.clipPath='polygon('+out.map(q=>(q[0]/sunDiameter*100).toFixed(2)+'% '+(q[1]/sunDiameter*100).toFixed(2)+'%').join(',')+')';
}else el.style.clipPath='none';
if(x<-margin||x>rect.width+margin||y<-margin||y>rect.height+margin){el.style.opacity='0';return}el.style.opacity=separation<1?.82:'1'}
function syncDayNight(){if(!mapReady)return;try{ensureDayNight();for(const id of ['twilight-18','twilight-12','twilight-6','night-side']){map.setLayoutProperty(id+'-fill','visibility',dayNightEnabled?'visible':'none');if(dayNightEnabled){const alt=id==='night-side'?0:-Number(id.split('-')[1]);map.getSource(id).setData(solarAltitudeBoundaryGeoJson(alt))}}map.setLayoutProperty('terminator-line','visibility',dayNightEnabled?'visible':'none');updateSunVisual()}catch(e){}}
function flagEmoji(code){return /^[A-Za-z]{2}$/.test(code||'')?[...code.toUpperCase()].map(ch=>String.fromCodePoint(127397+ch.charCodeAt())).join(''):'🌍'}
function approxLocalTime(lon){const offset=Math.round((+lon||0)/15);const d=new Date(Date.now()+offset*3600000);return d.toLocaleTimeString('ja-JP',{timeZone:'UTC',hour:'2-digit',minute:'2-digit',hour12:false})+'頃'}
function updateNowPlayingMarker(s){if(!mapReady||!s||!Number.isFinite(+s.geo_lat)||!Number.isFinite(+s.geo_long))return;const data={type:'FeatureCollection',features:[{type:'Feature',geometry:{type:'Point',coordinates:[+s.geo_long,+s.geo_lat]},properties:{label:`${flagEmoji(s.countrycode)} ${s.state||s.country||s.name||''} · ${approxLocalTime(s.geo_long)}`}}]};if(!map.getSource('now-playing')){map.addSource('now-playing',{type:'geojson',data});map.addLayer({id:'now-playing-glow',type:'circle',source:'now-playing',paint:{'circle-radius':['interpolate',['linear'],['zoom'],1,12,6,22],'circle-color':themeColor,'circle-opacity':.18,'circle-blur':.55,'circle-stroke-width':2,'circle-stroke-color':themeColor,'circle-stroke-opacity':.85}});map.addLayer({id:'now-playing-core',type:'circle',source:'now-playing',paint:{'circle-radius':5,'circle-color':'#ffffff','circle-stroke-width':3,'circle-stroke-color':themeColor}});map.addLayer({id:'now-playing-label',type:'symbol',source:'now-playing',layout:{'text-field':['get','label'],'text-size':11,'text-offset':[0,1.8],'text-anchor':'top','text-allow-overlap':true},paint:{'text-color':'#ffffff','text-halo-color':'#06100d','text-halo-width':2}})}else map.getSource('now-playing').setData(data)}
const map=new maplibregl.Map({container:'map',style:'https://demotiles.maplibre.org/style.json',center:[12,25],zoom:1.65,pitch:0,bearing:0,attributionControl:false,dragRotate:false,touchPitch:false});
map.on('move',updateSunVisual);map.on('resize',updateSunVisual);map.on('load',()=>{mapReady=true;try{map.setProjection({type:'globe'});map.setFog({color:'rgb(2,4,8)','high-color':'rgb(9,15,26)','horizon-blend':0.055,'space-color':'rgb(0,1,8)','star-intensity':.62})}catch(e){};if(stationPool.length)addStationsToMap();syncMapTheme();syncDayNight();clearInterval(solarTimer);solarTimer=setInterval(()=>{if(dayNightEnabled)syncDayNight();if(current)updateNowPlayingMarker(current)},60000)});
function stationGeoJson(){return{type:'FeatureCollection',features:stationPool.filter(s=>Number.isFinite(+s.geo_lat)&&Number.isFinite(+s.geo_long)).map(s=>({type:'Feature',geometry:{type:'Point',coordinates:[+s.geo_long,+s.geo_lat]},properties:{id:s.stationuuid,name:s.name,country:s.countrycode||'',favicon:s.favicon||''}}))}}
function addStationsToMap(){if(!mapReady)return;const data=stationGeoJson();if(map.getSource('stations')){map.getSource('stations').setData(data);syncMapTheme();return}map.addSource('stations',{type:'geojson',data,cluster:true,clusterMaxZoom:7,clusterRadius:38});map.addLayer({id:'clusters',type:'circle',source:'stations',filter:['has','point_count'],paint:{'circle-color':rgba(themeColor,.25),'circle-radius':['step',['get','point_count'],12,15,16,40,21],'circle-stroke-width':1,'circle-stroke-color':rgba(themeColor,.82)}});map.addLayer({id:'cluster-count',type:'symbol',source:'stations',filter:['has','point_count'],layout:{'text-field':['get','point_count_abbreviated'],'text-size':10},paint:{'text-color':'#dffff0'}});map.addLayer({id:'station-points',type:'circle',source:'stations',filter:['!',['has','point_count']],paint:{'circle-color':themeColor,'circle-radius':['interpolate',['linear'],['zoom'],1,2.2,6,5.2],'circle-blur':.15,'circle-stroke-color':rgba(themeColor,.26),'circle-stroke-width':['interpolate',['linear'],['zoom'],1,3,6,8]}});map.on('click','clusters',async e=>{const f=e.features[0];const zoom=await map.getSource('stations').getClusterExpansionZoom(f.properties.cluster_id);map.easeTo({center:f.geometry.coordinates,zoom:Math.min(zoom,8)})});map.on('click','station-points',e=>{const id=e.features[0].properties.id;const s=stationPool.find(x=>x.stationuuid===id);if(s)selectStation(s,true)});map.on('mouseenter','station-points',()=>map.getCanvas().style.cursor='pointer');map.on('mouseleave','station-points',()=>map.getCanvas().style.cursor='');markersLoaded=true;if(current)updateNowPlayingMarker(current)}
function idle(fn,timeout=1200){if('requestIdleCallback'in window)requestIdleCallback(fn,{timeout});else setTimeout(fn,80)}
function mergeStations(list){const m=new Map(stationPool.map(s=>[s.stationuuid,s]));for(const s of list){if(s&&s.stationuuid&&s.url_resolved)m.set(s.stationuuid,s)}stationPool=[...m.values()]}
async function loadMoreStations(){
  try{
    await discoverMirrors();
    const more=await api('/json/stations/search?hidebroken=true&has_geo_info=true&order=clickcount&reverse=true&limit=3000&offset=500');
    mergeStations(more);
    idle(()=>{addStationsToMap();status(`${stationPool.length.toLocaleString()}局を地球に表示 · 光点をタップ`)},1800)
  }catch(e){}
}
async function loadPool(){
  status('地球を起動しています…');
  try{
    const first=await api('/json/stations/search?hidebroken=true&has_geo_info=true&order=clickcount&reverse=true&limit=500');
    mergeStations(first);
    addStationsToMap();
    status(`${stationPool.length.toLocaleString()}局からすぐ探索できます · 残りはバックグラウンド読込中`);
    idle(loadMoreStations,1400)
  }catch(e){
    status('局データを取得できません。検索は引き続き利用できます');
    idle(loadMoreStations,800)
  }
}
function distance(a,b,c,d){const R=6371,rad=x=>x*Math.PI/180;const x=rad(c-a),y=rad(d-b);const z=Math.sin(x/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(z))}
function nearest(){const c=map.getCenter();return stationPool.filter(s=>s.geo_lat!=null&&s.geo_long!=null).map(s=>({...s,_d:distance(c.lat,c.lng,+s.geo_lat,+s.geo_long)})).sort((a,b)=>a._d-b._d).slice(0,30)}
function showList(list,title){$('#panelTitle').textContent=title;results.innerHTML='';if(!list.length){results.innerHTML='<div class="empty">該当する局がありません</div>';sheet.classList.add('show');return}list.slice(0,40).forEach(s=>{const row=document.createElement('div');row.className='result';const img=s.favicon?`<img src="${esc(s.favicon)}" onerror="this.remove()">`:'◉';row.innerHTML=`<div class="resultArt">${img}</div><div class="resultMeta"><div class="resultName">${esc(s.name)}</div><div class="resultSub">${esc([s.countrycode,s.state,s.codec,s.bitrate?`${s.bitrate}kbps`:null].filter(Boolean).join(' · '))}</div></div><button class="resultPlay">再生</button>`;row.querySelector('button').onclick=()=>selectStation(s,true);results.appendChild(row)});sheet.classList.add('show')}
function isFav(s){return !!s&&favorites.some(x=>x.stationuuid===s.stationuuid)}function updateFav(){if(current)$('#favBtn').textContent=isFav(current)?'♥':'♡'}
function updateArt(s){const a=$('#art');a.innerHTML=s.favicon?`<img src="${esc(s.favicon)}" onerror="this.parentNode.innerHTML='<span class=artFallback>◉</span>'">`:'<span class="artFallback">◉</span>'}
async function selectStation(s,autoplay=false){current=s;$('#stationName').textContent=s.name||'Unknown station';$('#stationSub').textContent=[s.countrycode,s.state,s.codec,s.bitrate?`${s.bitrate}kbps`:null].filter(Boolean).join(' · ')||'Internet radio';updateArt(s);updateFav();$('#liveLabel').style.visibility='hidden';recent=[s,...recent.filter(x=>x.stationuuid!==s.stationuuid)].slice(0,30);localStorage.setItem('worldio:recent',JSON.stringify(recent));if(s.geo_lat!=null&&s.geo_long!=null&&mapReady){updateNowPlayingMarker(s);map.easeTo({center:[+s.geo_long,+s.geo_lat],zoom:Math.max(map.getZoom(),4.5),duration:900})}audio.src=s.url_resolved||s.url;sheet.classList.remove('show');if(autoplay){status('接続中 · '+s.name);try{await audio.play();$('#playBtn').textContent='❚❚';$('#liveLabel').style.visibility='visible';status('LIVE · '+s.name);api('/json/url/'+encodeURIComponent(s.stationuuid)).catch(()=>{})}catch(e){status('この局はiPhoneで再生できません · 別の局を選択');toast('再生できないストリームです')}}}
$('#playBtn').onclick=async()=>{if(!current){showList(nearest(),'近くのラジオ局');return}if(audio.paused){try{await audio.play();$('#playBtn').textContent='❚❚';$('#liveLabel').style.visibility='visible';status('LIVE · '+current.name)}catch(e){toast('再生できません')}}else{audio.pause();$('#playBtn').textContent='▶';$('#liveLabel').style.visibility='hidden';status('一時停止')}};audio.onplaying=()=>{$('#playBtn').textContent='❚❚';$('#liveLabel').style.visibility='visible'};audio.onpause=()=>{$('#playBtn').textContent='▶';$('#liveLabel').style.visibility='hidden'};audio.onerror=()=>{if(current){status('ストリーム接続失敗 · 別の局を選んでください');$('#playBtn').textContent='▶';$('#liveLabel').style.visibility='hidden'}};$('#volume').oninput=e=>audio.volume=+e.target.value;audio.volume=.85;
$('#favBtn').onclick=()=>{if(!current)return;if(isFav(current)){favorites=favorites.filter(x=>x.stationuuid!==current.stationuuid);toast('お気に入りから削除')}else{favorites.unshift(current);favorites=favorites.slice(0,100);toast('お気に入りに追加')}localStorage.setItem('worldio:favs',JSON.stringify(favorites));updateFav()};$('#favListBtn').onclick=()=>showList(favorites,'お気に入り');$('#nearBtn').onclick=()=>showList(nearest(),'この場所の近く');$('#randomBtn').onclick=()=>{if(!stationPool.length)return;selectStation(stationPool[Math.floor(Math.random()*stationPool.length)],true)};$('#closeSheet').onclick=()=>sheet.classList.remove('show');sheet.onclick=e=>{if(e.target===sheet)sheet.classList.remove('show')};$('#themeBtn').onclick=showTheme;$('#themeBtn').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showTheme()}};
$('#searchForm').onsubmit=async e=>{e.preventDefault();const q=$('#search').value.trim();if(!q)return;status('検索中 · '+q);try{let list=await api('/json/stations/search?hidebroken=true&limit=40&order=clickcount&reverse=true&name='+encodeURIComponent(q));if(list.length<8){const byCountry=await api('/json/stations/search?hidebroken=true&limit=30&order=clickcount&reverse=true&country='+encodeURIComponent(q)).catch(()=>[]);const byTag=await api('/json/stations/search?hidebroken=true&limit=30&order=clickcount&reverse=true&tag='+encodeURIComponent(q)).catch(()=>[]);const m=new Map([...list,...byCountry,...byTag].map(s=>[s.stationuuid,s]));list=[...m.values()].slice(0,40)}showList(list,`検索 · ${q}`);status(`${list.length}局見つかりました`)}catch(e){status('検索に失敗しました');toast('通信エラー')}};
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
status('WORLDIO · 地球を準備中…');
if(mapReady)idle(loadPool,500);else map.once('load',()=>idle(loadPool,500));
</script>
</body>
