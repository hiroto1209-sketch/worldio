<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Worldio Solar Lab</title>
<style>*{box-sizing:border-box}html,body,#stage{margin:0;width:100%;height:100%;overflow:hidden;background:#02050d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}#stage{position:fixed;inset:0}.hud{position:fixed;z-index:3;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;pointer-events:none}.card{display:inline-block;padding:10px 13px;border:1px solid #ffffff22;border-radius:18px;background:#030712aa;backdrop-filter:blur(14px);font-size:12px;line-height:1.45}.title{font-size:14px;font-weight:800}.ok{color:#8dffc0}.note{position:fixed;z-index:3;left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));text-align:center;pointer-events:none}.note span{display:inline-block;padding:9px 12px;border-radius:16px;background:#030712aa;border:1px solid #ffffff1c;font-size:11px;color:#c9d3e6}</style></head>
<body><div id="stage"></div><div class="hud"><div class="card"><div class="title">WORLDIO · SOLAR LAB</div><div class="ok">地球固定 / 太陽ワールド座標固定</div><div id="info">UTCから太陽方向を計算中…</div></div></div><div class="note"><span>1本指: カメラを回す　2本指: ズーム · 太陽はカメラに追従しません</span></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';
const host=document.getElementById('stage'),scene=new THREE.Scene();scene.background=new THREE.Color(0x02050d);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.05,100);camera.position.set(0,0,4.2);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;host.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=2.25;controls.maxDistance=7;controls.target.set(0,0,0);
const starsGeo=new THREE.BufferGeometry(),stars=[];for(let i=0;i<650;i++){const r=25,th=Math.random()*Math.PI*2,u=Math.random()*2-1,s=Math.sqrt(1-u*u);stars.push(r*s*Math.cos(th),r*u,r*s*Math.sin(th))}starsGeo.setAttribute('position',new THREE.Float32BufferAttribute(stars,3));scene.add(new THREE.Points(starsGeo,new THREE.PointsMaterial({color:0x91a4c9,size:.025,sizeAttenuation:true})));
const earth=new THREE.Mesh(new THREE.SphereGeometry(1,96,64),new THREE.MeshStandardMaterial({color:0x183e62,roughness:.78,metalness:0}));scene.add(earth);
const landMat=new THREE.MeshStandardMaterial({color:0x567653,roughness:.9,polygonOffset:true,polygonOffsetFactor:-1});
const latLines=new THREE.Group();for(let lat=-60;lat<=60;lat+=30){const rr=Math.cos(lat*Math.PI/180),y=Math.sin(lat*Math.PI/180),pts=[];for(let i=0;i<=128;i++){const a=i/128*Math.PI*2;pts.push(new THREE.Vector3(rr*Math.cos(a)*1.002,y*1.002,rr*Math.sin(a)*1.002))}latLines.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x315a74,transparent:true,opacity:.24})))}earth.add(latLines);
const atmosphere=new THREE.Mesh(new THREE.SphereGeometry(1.025,96,64),new THREE.MeshBasicMaterial({color:0x5cbcff,transparent:true,opacity:.055,side:THREE.BackSide,depthWrite:false}));scene.add(atmosphere);
function solarSubpoint(date=new Date()){const jd=date.getTime()/86400000+2440587.5,T=(jd-2451545)/36525,L=(280.46646+T*(36000.76983+T*.0003032))%360,M=357.52911+T*(35999.05029-.0001537*T),Mr=M*Math.PI/180,C=(1.914602-T*(.004817+.000014*T))*Math.sin(Mr)+(.019993-.000101*T)*Math.sin(2*Mr)+.000289*Math.sin(3*Mr),lambda=(L+C-.00569-.00478*Math.sin((125.04-1934.136*T)*Math.PI/180))*Math.PI/180,eps=(23.439291-.0130042*T)*Math.PI/180,dec=Math.asin(Math.sin(eps)*Math.sin(lambda))*180/Math.PI,y=Math.tan(eps/2)**2,Lr=L*Math.PI/180,E=4*(y*Math.sin(2*Lr)-2*.016708634*Math.sin(Mr)+4*.016708634*y*Math.sin(Mr)*Math.cos(2*Lr)-.5*y*y*Math.sin(4*Lr)-1.25*.016708634*.016708634*Math.sin(2*Mr))*180/Math.PI,mins=date.getUTCHours()*60+date.getUTCMinutes()+date.getUTCSeconds()/60,lon=((720-mins-E)/4+540)%360-180;return{lat:dec,lon}}
const sunGroup=new THREE.Group(),sun=new THREE.Mesh(new THREE.SphereGeometry(.32,48,32),new THREE.MeshBasicMaterial({color:0xffc44d}));sunGroup.add(sun);const glow=new THREE.PointLight(0xffb84d,10,0,0);sunGroup.add(glow);scene.add(sunGroup);
const sunlight=new THREE.DirectionalLight(0xfff1d0,3.5);scene.add(sunlight);scene.add(sunlight.target);sunlight.target.position.set(0,0,0);
const ambient=new THREE.AmbientLight(0x0b1830,.09);scene.add(ambient);
const SUN_VISUAL_DISTANCE=6.5;
function updateSun(){const now=new Date(),s=solarSubpoint(now),lat=THREE.MathUtils.degToRad(s.lat),lon=THREE.MathUtils.degToRad(s.lon);/* One Earth-fixed basis for BOTH visible Sun and light: x=lon0, y=north, z=lon90E */const dir=new THREE.Vector3(Math.cos(lat)*Math.cos(lon),Math.sin(lat),Math.cos(lat)*Math.sin(lon)).normalize();sunGroup.position.copy(dir).multiplyScalar(SUN_VISUAL_DISTANCE);sunlight.position.copy(dir).multiplyScalar(10);document.getElementById('info').textContent='太陽直下点  '+s.lat.toFixed(2)+'° / '+s.lon.toFixed(2)+'° · '+now.toISOString().slice(11,16)+' UTC'}
updateSun();setInterval(updateSun,60000);
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script></body></html>
